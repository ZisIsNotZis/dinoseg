<svg xmlns="http://www.w3.org/2000/svg" width="480" height="128" viewBox="0 0 480 128" role="img" aria-labelledby="title">
  <title id="title">dinoseg — click-to-label segmentation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111f33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="128" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="127" rx="23.5" fill="none" stroke="#1e293b"/>

  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#mark)"/>

  <!-- 3x3 patch grid: a few clicked patches are filled, the rest stay faint -->
  <g fill="#f8fafc">
    <rect x="32" y="32" width="18" height="18" rx="5" opacity=".95"/>
    <rect x="55" y="32" width="18" height="18" rx="5" opacity=".95"/>
    <rect x="32" y="55" width="18" height="18" rx="5" opacity=".95"/>
    <rect x="55" y="55" width="18" height="18" rx="5" opacity=".95"/>
    <rect x="32" y="78" width="18" height="18" rx="5" opacity=".95"/>
    <rect x="55" y="78" width="18" height="18" rx="5" opacity=".2"/>
    <rect x="78" y="32" width="18" height="18" rx="5" opacity=".2"/>
    <rect x="78" y="55" width="18" height="18" rx="5" opacity=".2"/>
    <rect x="78" y="78" width="18" height="18" rx="5" opacity=".2"/>
  </g>

  <!-- pointer aimed at the next patch to label -->
  <path d="M82 74 L82 100 L88 94 L93 105 L99 102 L94 91 L103 91 Z"
        fill="#f8fafc" stroke="#0b1220" stroke-width="3" stroke-linejoin="round"/>

  <text x="132" y="68" fill="#f8fafc"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1.5">dinoseg</text>
  <text x="134" y="95" fill="#94a3b8"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="600" letter-spacing="1.6">CLICK-TO-LABEL SEGMENTATION</text>
</svg>
